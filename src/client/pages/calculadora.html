    <script>
      function calcularJuros(e) {
        e.preventDefault();

        const btn = document.getElementById("btnAnalisar");
        const resultado = document.getElementById("resultadoAnalise");

        btn.disabled = true;
        btn.innerHTML =
          '<i class="fas fa-spinner fa-spin me-2"></i> Consultando Banco Central...';

        const modalidade = document.getElementById("modalidade").value;
        const dataContratacao =
          document.getElementById("dataContratacao").value;
        const financiado = parseFloat(
          document.getElementById("valorFinanciado").value,
        );
        const n = parseInt(document.getElementById("qtdParcelas").value);
        const pmt = parseFloat(document.getElementById("valorParcela").value);

        if (typeof google !== "undefined" && google.script) {
          google.script.run
            .withSuccessHandler((resBacen) => {
              btn.disabled = false;
              btn.innerText = "Analisar contrato";

              if (!resBacen.sucesso) {
                alert("Erro ao consultar BACEN: " + resBacen.mensagem);
                return;
              }

              // Cálculo aproximado da taxa do contrato do cliente
              const totalPago = pmt * n;
              const taxaEstimadaContrato =
                ((totalPago - financiado) / financiado / n) * 100;
              const taxaBacen = resBacen.taxaMediaBacen;

              resultado.style.display = "block";

              if (taxaEstimadaContrato > taxaBacen) {
                resultado.className = "alert alert-warning mt-4 border-warning";
                resultado.innerHTML = `
                <h5 class="fw-bold text-dark mb-2"><i class="fas fa-exclamation-triangle text-warning me-2"></i> Indício de Juros Abusivos Encontrado!</h5>
                <p class="small text-dark mb-2">
                  A taxa estimada do seu contrato é de aproximadamente <strong>${taxaEstimadaContrato.toFixed(2)}% a.m.</strong>, enquanto a taxa média praticada pelo mercado na época (BACEN) era de <strong>${taxaBacen.toFixed(2)}% a.m.</strong>
                </p>
                <div class="mt-3 text-center">
                  <a href="https://wa.me/5551995840635?text=Olá!%20Fiz%20a%20simulação%20na%20calculadora%20e%20identifiquei%20suspeita%20de%20juros%20abusivos%20no%20meu%20contrato." 
                     target="_blank" class="btn btn-success fw-bold">
                    <i class="fab fa-whatsapp me-2"></i> Enviar resultado para um Advogado pelo Whats
                  </a>
                </div>
              `;
              } else {
                resultado.className = "alert alert-success mt-4 border-success";
                resultado.innerHTML = `
                <h5 class="fw-bold text-dark mb-2"><i class="fas fa-check-circle text-success me-2"></i> Taxa Dentro do Esperado</h5>
                <p class="small text-dark mb-0">
                  A taxa do seu contrato parece estar alinhada com a média praticada pelo Banco Central na época (<strong>${taxaBacen.toFixed(2)}% a.m.</strong>).
                </p>
              `;
              }
            })
            .consultarTaxaBacen(modalidade, dataContratacao);
        }
      }
    </script>
