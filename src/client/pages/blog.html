  <body class="bg-fundo d-flex flex-column min-vh-100">
    <?!= include('header', pageAtual, hostUrl); ?>

    <!-- Título da Página -->
    <section class="py-5 bg-white border-bottom">
      <div class="container text-center">
        <h1 class="text-principal fw-bold mb-3">Blog Jurídico</h1>
        <p class="text-muted lead">
          Artigos, notícias e orientações sobre os seus direitos.
        </p>
      </div>
    </section>

    <!-- Grid de Artigos -->
    <main class="flex-grow-1 py-5">
      <div class="container">
        <!-- Loading State -->
        <div id="loading-blog" class="text-center py-5">
          <div class="spinner-border text-destaque" role="status">
            <span class="visually-hidden">Carregando...</span>
          </div>
          <p class="text-muted mt-3">Buscando as últimas publicações...</p>
        </div>

        <!-- Container onde os cards serão injetados -->
        <div
          class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"
          id="grid-artigos"
        >
          <!-- Os artigos aparecerão aqui -->
        </div>

        <!-- Mensagem de Blog Vazio -->
        <div id="mensagem-vazio" class="text-center py-5" style="display: none">
          <i class="fas fa-folder-open text-muted fa-3x mb-3 opacity-50"></i>
          <h4 class="text-muted">Nenhum artigo publicado no momento.</h4>
        </div>
      </div>
    </main>

    <?!= include('footer'); ?>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <?!= include('scripts'); ?>

    <script>
      // Assim que a página carregar, busca os artigos
      document.addEventListener("DOMContentLoaded", function () {
        if (typeof google !== "undefined" && google.script) {
          google.script.run
            .withSuccessHandler(renderizarArtigos)
            .withFailureHandler((erro) => {
              console.error(erro);
              document.getElementById("loading-blog").innerHTML =
                "<span class='text-danger'>Erro ao carregar o blog.</span>";
            })
            .buscarArtigosBlog();
        }
      });

      function renderizarArtigos(artigos) {
        document.getElementById("loading-blog").style.display = "none";

        if (artigos.length === 0) {
          document.getElementById("mensagem-vazio").style.display = "block";
          return;
        }

        const grid = document.getElementById("grid-artigos");
        grid.innerHTML = "";

        artigos.forEach((artigo) => {
          // Ajusta a data para exibir apenas o dia, mês e ano
          const dataCurta = artigo.data ? artigo.data.split(" ")[0] : "";

          const cardHTML = `
            <div class="col">
              <div class="card card-blog h-100 bg-white shadow-sm position-relative">
                <span class="badge-data"><i class="far fa-calendar-alt me-1"></i> ${dataCurta}</span>
                <img src="${artigo.capa}" class="card-img-top capa-blog" alt="Capa do Artigo" onerror="this.src='https://via.placeholder.com/600x400?text=Sem+Imagem'">
                <div class="card-body d-flex flex-column p-4">
                  <h5 class="card-title text-principal fw-bold mb-3">${artigo.titulo}</h5>
                  <p class="card-text text-muted small flex-grow-1">${artigo.resumo}</p>
                  
                  <div class="mt-3 border-top pt-3 text-end">
                    <!-- O botão ainda não tem o link real de leitura, faremos na próxima etapa -->
                    <a href="<?= hostUrl ?>?page=artigo&id=${artigo.id}" class="btn btn-outline-dourado btn-sm fw-semibold rounded-pill px-4">
                      Ler Completo <i class="fas fa-arrow-right ms-1"></i>
                    </a>
                  </div>
                </div>
              </div>
            </div>
          `;
          grid.innerHTML += cardHTML;
        });
      }
    </script>
  </body>
</html>
