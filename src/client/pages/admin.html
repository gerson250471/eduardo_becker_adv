    <script>
      function autenticarUsuario(event) {
        event.preventDefault();
        const btn = document.getElementById("btnEntrar");
        const alerta = document.getElementById("alertaLogin");

        btn.disabled = true;
        btn.innerHTML =
          '<i class="fas fa-spinner fa-spin me-2"></i> Autenticando...';
        alerta.style.display = "none";

        const usuario = document.getElementById("usuario").value;
        const senha = document.getElementById("senha").value;

        if (typeof google !== "undefined" && google.script) {
          google.script.run
            .withSuccessHandler((resposta) => {
              btn.disabled = false;
              btn.innerText = "Acessar Painel";

              if (resposta.sucesso) {
                // Redireciona ou exibe o painel administrativo
                alert("Login efetuado com sucesso!");
              } else {
                alerta.innerText =
                  resposta.mensagem || "Usuário ou senha inválidos.";
                alerta.style.display = "block";
              }
            })
            .validarLogin(usuario, senha);
        } else {
          // Teste visual local
          setTimeout(() => {
            btn.disabled = false;
            btn.innerText = "Acessar Painel";
            alerta.innerText =
              "Funcionalidade conectada à planilha do Google Sheets!";
            alerta.style.display = "block";
          }, 1000);
        }
      }
    </script>
