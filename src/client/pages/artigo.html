    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // NOVO: Recebe o ID de forma segura injetado pelo Back-end
        const idArtigo = "<?= idArtigo ?>";

        if (!idArtigo) {
          mostrarErro();
          return;
        }

        // Chama o servidor para buscar o artigo
        if (typeof google !== "undefined" && google.script) {
          google.script.run
            .withSuccessHandler(renderizarArtigo)
            .withFailureHandler(mostrarErro)
            .buscarArtigoPorId(idArtigo);
        }
      });

      function renderizarArtigo(artigo) {
        document.getElementById("loading-artigo").style.display = "none";

        if (!artigo) {
          mostrarErro();
          return;
        }

        // Preenche os dados na tela
        document.getElementById("artigo-titulo").innerText = artigo.titulo;
        document.getElementById("artigo-autor").innerText = artigo.autor;
        document.getElementById("artigo-data").innerText = artigo.data
          ? artigo.data.split(" ")[0]
          : "";
        document.getElementById("artigo-capa").src = artigo.capa;

        // Injeta o HTML gerado pelo editor
        document.getElementById("artigo-conteudo").innerHTML = artigo.conteudo;

        document.getElementById("container-artigo").style.display = "flex";
      }

      function mostrarErro() {
        document.getElementById("loading-artigo").style.display = "none";
        document.getElementById("mensagem-erro").style.display = "block";
      }
    </script>
