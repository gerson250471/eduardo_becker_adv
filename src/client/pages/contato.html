    <!-- Script de envio do formulário -->
    <script>
      function enviarMensagemContato(event) {
        event.preventDefault();

        const btn = document.getElementById("btnEnviarContato");
        const alerta = document.getElementById("alertaContato");

        btn.disabled = true;
        btn.innerHTML =
          '<i class="fas fa-spinner fa-spin me-2"></i>Enviando...';

        const dados = {
          nome: document.getElementById("nomeContato").value,
          telefone: document.getElementById("telefoneContato").value,
          email: document.getElementById("emailContato").value,
          cidade: document.getElementById("cidadeContato").value,
          mensagem: document.getElementById("mensagemContato").value,
        };

        if (typeof google !== "undefined" && google.script) {
          google.script.run
            .withSuccessHandler((resposta) => {
              btn.disabled = false;
              btn.innerText = "Enviar";

              if (resposta.sucesso) {
                alerta.className = "alert alert-success mt-3";
                alerta.innerText =
                  "Sua mensagem foi enviada com sucesso! Entraremos em contato em breve.";
                document.getElementById("formContato").reset();
              } else {
                alerta.className = "alert alert-danger mt-3";
                alerta.innerText = resposta.mensagem;
              }
              alerta.style.display = "block";
            })
            .withFailureHandler(() => {
              btn.disabled = false;
              btn.innerText = "Enviar";
              alerta.className = "alert alert-danger mt-3";
              alerta.innerText =
                "Erro de conexão ao enviar mensagem. Tente novamente.";
              alerta.style.display = "block";
            })
            .salvarContato(dados);
        } else {
          // Teste visual offline
          setTimeout(() => {
            btn.disabled = false;
            btn.innerText = "Enviar";
            alerta.className = "alert alert-success mt-3";
            alerta.innerText =
              "Sua mensagem foi enviada com sucesso! (Modo Teste)";
            alerta.style.display = "block";
            document.getElementById("formContato").reset();
          }, 1000);
        }
      }
    </script>
