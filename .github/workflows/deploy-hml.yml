name: Deploy Homologacao

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar o Google Clasp
        run: npm install -g @google/clasp

      - name: Autenticar Clasp silenciosamente
        run: |
          echo '${{ secrets.CLASP_TOKEN }}' > ~/.clasprc.json

      - name: Montar configuração de HML
        run: |
          echo '{"scriptId":"${{ secrets.SCRIPT_ID_HML }}","rootDir":"./src"}' > .clasp.json

      - name: Push para o Google Apps Script
        run: clasp push -f
